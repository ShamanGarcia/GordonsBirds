services:
  - type: web
    name: gordons-birds
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start:render
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        value: file:/var/data/dev.db
      - key: NEXT_PUBLIC_MAPBOX_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: AUTH_SECRET
        sync: false
    disk:
      name: gordons-birds-data
      mountPath: /var/data
      sizeGB: 1
